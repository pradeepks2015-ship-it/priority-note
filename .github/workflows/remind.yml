name: Hourly reminder

on:
  schedule:
    # Every hour from 9:03 AM to 6:03 PM India time (03:33–12:33 UTC). GitHub may start a few minutes late.
    - cron: '33 3-12 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'काम के घंटों के बाहर भी भेजें (जाँच के लिए)'
        type: boolean
        default: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: npm install --no-save --omit=dev firebase-admin@12.7.0  # जाँच वाले dev औज़ार नहीं, सिर्फ़ यह
      - run: node notify/send.mjs
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          FORCE: ${{ inputs.force && '1' || '' }}
