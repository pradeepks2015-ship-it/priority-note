name: Smoke test

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version bumped?
        run: sh tests/version-bump.sh "${{ github.event.pull_request.base.sha || github.event.before }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Hourly reminder text
        run: node tests/notify.mjs
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve app
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 &
          sleep 2
      - name: Run smoke test
        run: node tests/smoke.mjs
        env:
          APP_URL: http://127.0.0.1:8080/
      - name: Run online-backup test (stand-in Firebase)
        run: node tests/cloud.mjs
        env:
          APP_URL: http://127.0.0.1:8080/
      - name: Run feeder-map test (stand-in GPS)
        run: node tests/feeder.mjs
        env:
          APP_URL: http://127.0.0.1:8080/
